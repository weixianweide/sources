name: 提交或更新数据源
description: 加一个新的数据源，或者更新已经失效的源
title: "[数据源] "
labels: ["数据源"]
body:
  - type: markdown
    attributes:
      value: |
        感谢投稿！在应用的数据源设置里找到要提交的源，选「导出」，把导出的内容整段贴到下面。
        维护者测过之后会把它加进订阅。层级（优先级）由维护者定，不用填。
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新增数据源
        - 更新已有的数据源
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 数据源名称
      description: 更新已有的源时，填订阅里现在的名字
      placeholder: 例如 稀饭动漫
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: 网站地址
      placeholder: https://
  - type: textarea
    id: json
    attributes:
      label: 数据源 JSON
      description: 应用里「导出」出来的内容，整段贴进来
      render: json
    validations:
      required: true
  - type: textarea
    id: tested
    attributes:
      label: 测试情况
      description: 测过哪部番、哪一集能播，大概多久开始播放；更新的话写一下原来哪里坏了
    validations:
      required: true
  - type: dropdown
    id: ads
    attributes:
      label: 有没有广告
      options:
        - 没有
        - 视频里有广告
        - 只有网页上有，播放时没有
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这份配置是我自己写的，或者原作者的许可允许转载（没有许可证的规则库里的规则不能提交）
          required: true
        - label: 网站不需要付费，也不需要登录账号就能看
          required: true
        - label: 我同意按本仓库的许可证（CC0 1.0）提供这份配置
          required: true
