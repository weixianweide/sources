name: 生成 subscription.json

on:
  push:
    branches: [main]
    paths: ['sources/**', 'order.txt', 'scripts/build.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/build.py
      - name: 提交
        run: |
          if git diff --quiet -- subscription.json; then
            echo "subscription.json 没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.json
          git commit -m "生成 subscription.json"
          git push
