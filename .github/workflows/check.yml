name: 检查数据源

on:
  pull_request:
    paths: ['sources/**', 'order.txt', 'scripts/**', 'subscription.json']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: subscription.json 由 sources/ 生成，不能直接改
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx subscription.json; then
            echo "::error file=subscription.json::subscription.json 是合并后自动生成的，请只改 sources/ 下的文件"
            exit 1
          fi
      - name: 检查数据源
        run: python3 scripts/build.py --check $(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- sources/)
